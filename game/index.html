<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Vault — defend the core</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Announced to screen readers, never painted: the screen and event status line. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Hollow Vault: orbit the central vault, aim the turret and fire at incoming geometric intruders to defend its three shields"></canvas>
<img id="capture" alt="" style="display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:fill">
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
